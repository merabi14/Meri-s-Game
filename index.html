<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meri`s Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main class="app">
      <header class="top">
        <h1>Meri`s Game</h1>
        <section class="score-panel" aria-label="Score panel">
          <p class="score" id="score">Score: 0 / 1</p>
          <div class="score-track" aria-hidden="true">
            <span class="score-fill" id="scoreFill"></span>
          </div>
        </section>
      </header>
      <section class="phase-hint" id="phaseHint">
        Fill this card, then click Next Card or Start Game.
      </section>
      <section class="card-grid" id="cardGrid" aria-label="Flashcards"></section>
      <section class="controls bottom-controls" aria-label="Game controls">
        <button id="startBtn" class="secondary" disabled>Start Game</button>
        <button id="resetBtn">Reset Game</button>
      </section>
    </main>
    <script src="script.js"></script>
  </body>
</html>
